<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="keywords" content="goods4u,Goods4u,buy shoes online Pakistan, smartwatches, jackets, electronics deals, goods4u, goods4u.netlify.app" />
    <meta name="description" content="Shop footwear, watches, jackets, and electronics at Goods4U. Free delivery & cash on delivery available." />
    <title>Goods4U – Fashion & Tech Deals</title>
    
    <!-- Preconnect to Google Fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Load Google Fonts asynchronously to avoid blocking render -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" />
    
    <!-- Non-blocking font loading -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    </noscript>
    
    <!-- Intercept and make CSS loading non-blocking -->
    <script>
      // Intercept stylesheet links to make them non-blocking
      (function() {
        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              if (node.nodeName === 'LINK' && node.rel === 'stylesheet') {
                // Make CSS non-blocking
                node.media = 'print';
                node.onload = function() {
                  this.media = 'all';
                };
                // Fallback for browsers that don't support onload
                if (!node.onload) {
                  var img = document.createElement('img');
                  img.onerror = function() {
                    node.media = 'all';
                  };
                }
              }
            });
          });
        });
        
        // Start observing when DOM is ready
        if (document.head) {
          observer.observe(document.head, {
            childList: true,
            subtree: false
          });
        } else {
          document.addEventListener('DOMContentLoaded', function() {
            observer.observe(document.head, {
              childList: true,
              subtree: false
            });
          });
        }
        
        // Also handle existing stylesheets
        document.addEventListener('DOMContentLoaded', function() {
          var links = document.querySelectorAll('link[rel="stylesheet"]');
          links.forEach(function(link) {
            if (!link.media || link.media === 'all') {
              link.media = 'print';
              link.onload = function() {
                this.media = 'all';
              };
            }
          });
        });
      })();
    </script>
  </head>

    <div id="root"></div>
   

  </body>
